[package]
name = "gase-recomp-jit-app"
description = "gase with the JIT for every ROM: gase-jit on a desktop, an Android app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "gase-jit"
path = "src/main.rs"

[dependencies]
gase-recomp-jit = { path = "../jit" }
gase-recomp-remote = { path = "../remote" }
gase-core.workspace = true
# gase's frontends (desktop) and its phone shell, without its own SDL_main:
# lib.rs exports ours on Android. Same revision as the rest (one gase-core).
gase = { git = "https://github.com/bthuner/gase", rev = "0cf61ff8bb7a55a57b5473845720403489b5e780", default-features = false }
gase-mobile = { git = "https://github.com/bthuner/gase", rev = "0cf61ff8bb7a55a57b5473845720403489b5e780", default-features = false }

# Only named for `static-sdl` below: gase's own SDL2, with more features.
sdl2 = { version = "0.37", optional = true }

[features]
default = ["window"]
# gase's window, sound and gamepads (needs the SDL2 development package).
window = ["gase/sdl"]
# SDL2 compiled from source (CMake) and linked into the program, so it runs
# without SDL2 installed: the release downloads use it.
static-sdl = ["window", "dep:sdl2", "sdl2/bundled", "sdl2/static-link"]

# Exporting SDL_main needs unsafe, in one function of lib.rs.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
