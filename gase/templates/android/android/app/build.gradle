// Android build for "@TITLE@", generated by gase-recomp.
// The native code (runtime + recompiled game + SDL2) is built by the
// shared ../../CMakeLists.txt; SDL2's Java glue comes from its sources.
plugins {
    id 'com.android.application'
}

def sdl2Dir = System.getenv("SDL2_SOURCE_DIR") ?: file("../../third_party/SDL2").absolutePath
if (!file("${sdl2Dir}/CMakeLists.txt").exists()) {
    throw new GradleException("SDL2 sources not found in ${sdl2Dir}: run scripts/fetch_sdl2.sh")
}

android {
    namespace "org.gaserecomp.@ID@"
    compileSdk 34

    defaultConfig {
        applicationId "org.gaserecomp.@ID@"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild {
            cmake { arguments "-DGASE_SDL2_SOURCE_DIR=${sdl2Dir}" }
        }
    }
    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1"
        }
    }
    sourceSets {
        main {
            java.srcDirs = ['src/main/java', "${sdl2Dir}/android-project/app/src/main/java"]
            assets.srcDirs = ['../../assets']       // rom.bin
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug      // replace with your own key
        }
    }
}
