[project]
name = "gase-recomp"
version = "0.1.0"
description = "A pedagogic static recompiler for Sega Genesis / Mega Drive ROMs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Théo Hunerblaes" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "machine68k>=0.4"]

[project.scripts]
gase = "gase.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
